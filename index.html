<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celebrate Recovery Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="site-header">
      <h1>Celebrate Recovery Map</h1>
      <p class="site-subtitle">Ontario locations</p>
    </header>

    <main class="main-layout">
      <section class="sidebar" aria-label="Location details">
        <h2>Locations</h2>
        <p class="sidebar-intro">
          This prototype loads Celebrate Recovery locations from Supabase and displays them on the map.
        </p>

        <p id="status" class="status" aria-live="polite">Starting…</p>

        <div id="location-list" class="location-list" aria-live="polite"></div>
      </section>

      <section class="map-panel">
        <div id="map" aria-label="Map of Celebrate Recovery locations"></div>
      </section>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
