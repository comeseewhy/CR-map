<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celebrate Recovery Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="site-header">
      <h1>Celebrate Recovery Map</h1>
      <p class="site-subtitle">Ontario locations</p>
    </header>

    <main class="main-layout">
      <section class="sidebar" aria-label="Location details">
        <h2>Locations</h2>
        <p class="sidebar-intro">
          Find Celebrate Recovery locations across Ontario.
        </p>

        <div class="filters" aria-label="Filters">
          <label class="filter-group" for="search-input">
            <span class="filter-label">Search</span>
            <input
              id="search-input"
              class="filter-input"
              type="search"
              placeholder="Search by name, city, address..."
              autocomplete="off"
            />
          </label>

          <div class="filter-group">
            <span class="filter-label">Days</span>
            <div
              id="day-toggle-group"
              class="day-toggle-group"
              role="group"
              aria-label="Filter by meeting day"
            >
              <button type="button" class="day-toggle" data-day="Monday" aria-pressed="false">Mon</button>
              <button type="button" class="day-toggle" data-day="Tuesday" aria-pressed="false">Tue</button>
              <button type="button" class="day-toggle" data-day="Wednesday" aria-pressed="false">Wed</button>
              <button type="button" class="day-toggle" data-day="Thursday" aria-pressed="false">Thu</button>
              <button type="button" class="day-toggle" data-day="Friday" aria-pressed="false">Fri</button>
              <button type="button" class="day-toggle" data-day="Saturday" aria-pressed="false">Sat</button>
              <button type="button" class="day-toggle" data-day="Sunday" aria-pressed="false">Sun</button>
            </div>
          </div>

          <label class="checkbox-row" for="hybrid-only">
            <input id="hybrid-only" type="checkbox" />
            <span>Hybrid only</span>
          </label>

          <button id="reset-filters" class="reset-button" type="button">
            Reset filters
          </button>
        </div>

        <p id="status" class="status" aria-live="polite">Starting…</p>

        <div id="location-list" class="location-list" aria-live="polite"></div>
      </section>

      <section class="map-panel">
        <div id="map" aria-label="Map of Celebrate Recovery locations"></div>
      </section>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
